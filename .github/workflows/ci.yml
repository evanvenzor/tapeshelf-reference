name: Validate reference
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Private account allowance is unverified. Do not incur charges by default.
    if: github.event.repository.private == false || vars.ALLOW_PRIVATE_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test
      - run: node scripts/check.mjs
